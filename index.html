<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Explore job openings across popular career categories."
    />
    <title>Browse Job Categories</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>

  <body>
    <main class="page-content">
      <section class="categories" aria-labelledby="categories-heading">
        <h1 class="section-title" id="categories-heading">
          Browse by<br />
          <span class="highlighted-word">
            <span class="highlight-bar" aria-hidden="true"></span>
            <span class="highlighted-word__text">Job</span>
          </span>
          Categories
        </h1>

        <div class="category-grid">
          <article class="category-card">
            <div class="category-icon" aria-hidden="true">
              <svg
                class="category-icon__image"
                viewBox="0 0 24 24"
                fill="currentColor"
              >
                <path
                  d="M3 9.5v5h3l5 4v-13l-5 4H3Zm10.5-2.2v9.4a6 6 0 0 0 0-9.4ZM15 4.7v2.1a7 7 0 0 1 0 10.4v2.1a9 9 0 0 0 0-14.6Z"
                />
              </svg>
            </div>
            <div class="category-card__footer">
              <div>
                <h2 class="category-card__title">Digital Marketing</h2>
                <p class="category-card__description">143 Jobs Opened</p>
              </div>
              <span class="category-card__arrow" aria-hidden="true">→</span>
            </div>
          </article>

          <article class="category-card">
            <div class="category-icon" aria-hidden="true">
              <svg
                class="category-icon__image"
                viewBox="0 0 24 24"
                fill="currentColor"
              >
                <path
                  d="m3 17.3-.8 4.5 4.5-.8L19 8.7 15.3 5 3 17.3Zm17.7-10a1 1 0 0 0 0-1.4l-2.6-2.6a1 1 0 0 0-1.4 0l-1.8 1.8 4 4 1.8-1.8ZM5.2 18.5l-1.1 1.1.3-1.5 1-1 1.2 1.2-1.4.2Zm5-5.8 1.1 1.1-3.8 3.8-1.1-1.1 3.8-3.8Z"
                />
              </svg>
            </div>
            <div class="category-card__footer">
              <div>
                <h2 class="category-card__title">Art &amp; Design</h2>
                <p class="category-card__description">110 Jobs Opened</p>
              </div>
              <span class="category-card__arrow" aria-hidden="true">→</span>
            </div>
          </article>

          <article class="category-card category-card--featured">
            <div class="category-icon category-icon--featured" aria-hidden="true">
              <svg
                class="category-icon__image category-icon__image--money"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2.4"
                stroke-linecap="round"
              >
                <path
                  d="M12 3v18M16 7.5c0-1.7-1.8-3-4-3s-4 1.3-4 3 1.4 2.7 4 3.5 4 1.8 4 3.5-1.8 3-4 3-4-1.3-4-3"
                />
              </svg>
            </div>
            <div class="category-card__footer">
              <div>
                <h2 class="category-card__title">Accounting</h2>
                <p class="category-card__description">158 Jobs Opened</p>
              </div>
              <span class="category-card__arrow" aria-hidden="true">→</span>
            </div>
          </article>

          <article class="category-card">
            <div class="category-icon" aria-hidden="true">
              <svg
                class="category-icon__image"
                viewBox="0 0 24 24"
                fill="currentColor"
              >
                <path
                  d="M9 4a2 2 0 1 0 0 4 2 2 0 0 0 0-4Zm6 0a2 2 0 1 0 0 4 2 2 0 0 0 0-4ZM5 8h14a3 3 0 0 1 3 3v8a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2v-8a3 3 0 0 1 3-3Zm2 3a1 1 0 0 0-1 1v6h12v-6a1 1 0 0 0-1-1H7Zm5 1a3 3 0 1 1 0 6 3 3 0 0 1 0-6Zm0 1.5a1.5 1.5 0 1 0 0 3 1.5 1.5 0 0 0 0-3Z"
                />
              </svg>
            </div>
            <div class="category-card__footer">
              <div>
                <h2 class="category-card__title">Photography</h2>
                <p class="category-card__description">95 Jobs Opened</p>
              </div>
              <span class="category-card__arrow" aria-hidden="true">→</span>
            </div>
          </article>

          <article class="category-card">
            <div class="category-icon" aria-hidden="true">
              <svg
                class="category-icon__image"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <path
                  d="M12 20H5a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h10M15 3h6v6M10 14 21 3M8 16l2 .5.5 2L8 20l-.5-2L6 17.5 8 16Z"
                />
              </svg>
            </div>
            <div class="category-card__footer">
              <div>
                <h2 class="category-card__title">Copy Writing</h2>
                <p class="category-card__description">113 Jobs Opened</p>
              </div>
              <span class="category-card__arrow" aria-hidden="true">→</span>
            </div>
          </article>

          <article class="category-card">
            <div class="category-icon" aria-hidden="true">
              <svg
                class="category-icon__image"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <path
                  d="M4 13v-2a8 8 0 0 1 16 0v2M4 13H3v4h3v-4H4Zm16 0h1v4h-3v-4h2ZM7 19h4"
                />
              </svg>
            </div>
            <div class="category-card__footer">
              <div>
                <h2 class="category-card__title">Music</h2>
                <p class="category-card__description">55 Jobs Opened</p>
              </div>
              <span class="category-card__arrow" aria-hidden="true">→</span>
            </div>
          </article>

          <article class="category-card">
            <div class="category-icon" aria-hidden="true">
              <svg
                class="category-icon__image"
                viewBox="0 0 24 24"
                fill="currentColor"
              >
                <path
                  d="M9 4a2 2 0 1 0 0 4 2 2 0 0 0 0-4Zm8 2a2 2 0 1 0 0 4 2 2 0 0 0 0-4ZM8 9a3 3 0 0 0-3 3v6a1 1 0 0 0 2 0v-4h1v7h3v-7h1v4a1 1 0 0 0 2 0v-6a3 3 0 0 0-3-3H8Zm8 4a2 2 0 0 1 4 0v2h1v4h-6v-4h1v-2Z"
                />
              </svg>
            </div>
            <div class="category-card__footer">
              <div>
                <h2 class="category-card__title">Human Resources</h2>
                <p class="category-card__description">25 Jobs Opened</p>
              </div>
              <span class="category-card__arrow" aria-hidden="true">→</span>
            </div>
          </article>

          <a
            class="more-card"
            href="#categories-heading"
            aria-label="Explore 30 more categories"
          >
            <svg
              class="more-card__pattern"
              aria-hidden="true"
              viewBox="0 0 187 151"
              preserveAspectRatio="none"
            >
              <path
                d="M28-8c0 25 15 37 40 37 33 0 42-11 69 0s35 30 55 18M60-8c0 20 9 23 31 23 31 0 47-5 71 11s30 34 56 24M-8 145c23-19 35-20 58-7 26 15 43 20 74 9s41-13 72 3M-5 123c18-14 30-16 52-5 25 12 48 20 76 10 30-11 46-9 72 6"
                fill="none"
                stroke="currentColor"
                stroke-width=".8"
              />
            </svg>
            <span class="more-card__content">
              <span>Explore<br />30 More<br />Categories</span>
              <span class="more-card__arrow" aria-hidden="true">→</span>
            </span>
          </a>
        </div>
      </section>
    </main>
  </body>
</html>
